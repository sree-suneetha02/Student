<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Management</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 900px; margin: 50px auto; padding: 20px; }
        h1, h2 { color: #333; }
        .section { margin-bottom: 30px; padding: 20px; border: 1px solid #ddd; border-radius: 10px; }
        input, button { padding: 10px; margin: 5px; }
        button { cursor: pointer; border: none; border-radius: 5px; }
        .btn-add { background: #28a745; color: white; }
        .btn-update { background: #ffc107; color: black; }
        .btn-delete { background: #dc3545; color: white; }
        .student-item { padding: 15px; border: 1px solid #ddd; margin: 10px 0; border-radius: 5px; display: flex; justify-content: space-between; align-items: center; }
        .student-info { flex-grow: 1; }
        .student-actions button { margin-left: 5px; padding: 5px 10px; }
    </style>
</head>
<body>
    <h1>Student Management System</h1>
    
    <div class="section">
        <h2>Add New Student</h2>
        <form id="addForm">
            <input type="text" id="addName" placeholder="Name" required>
            <input type="number" id="addAge" placeholder="Age" required>
            <input type="email" id="addEmail" placeholder="Email" required>
            <button type="submit" class="btn-add">Add Student</button>
        </form>
    </div>

    <div class="section">
        <h2>Update Student</h2>
        <form id="updateForm">
            <input type="number" id="updateId" placeholder="Student ID" required>
            <input type="text" id="updateName" placeholder="New Name">
            <input type="number" id="updateAge" placeholder="New Age">
            <input type="email" id="updateEmail" placeholder="New Email">
            <button type="submit" class="btn-update">Update Student</button>
        </form>
    </div>

    <div class="section">
        <h2>Delete Student</h2>
        <form id="deleteForm">
            <input type="number" id="deleteId" placeholder="Student ID" required>
            <button type="submit" class="btn-delete">Delete Student</button>
        </form>
    </div>

    <div class="section">
        <h2>All Students</h2>
        <button class="btn-add" onclick="loadStudents()">Load All Students</button>
        <div id="studentsList"></div>
        <div id="pagination"></div>
    </div>

    <div class="section">
        <h2>Get Student by ID</h2>
        <form id="getForm">
            <input type="number" id="getId" placeholder="Student ID" required>
            <button type="submit">Get Student</button>
        </form>
        <div id="studentDetail"></div>
    </div>

    <script>
        const API = 'http://localhost:5015';
        let allStudents = [];
        const perPage = 5;
        let currentPage = 1;

        async function loadStudents() {
            const res = await fetch(API + '/students');
            allStudents = await res.json();
            currentPage = 1;
            renderStudents();
        }

        function renderStudents() {
            const start = (currentPage - 1) * perPage;
            const end = start + perPage;
            const pageStudents = allStudents.slice(start, end);
            
            document.getElementById('studentsList').innerHTML = pageStudents.length ? 
                pageStudents.map(s => `<div class="student-item">
                    <div class="student-info"><strong>ID:</strong> ${s.id} | <strong>Name:</strong> ${s.name} | <strong>Age:</strong> ${s.age} | <strong>Email:</strong> ${s.email}</div>
                    <div class="student-actions">
                        <button class="btn-update" onclick="editStudent(${s.id}, '${s.name}', ${s.age}, '${s.email}')">Edit</button>
                        <button class="btn-delete" onclick="deleteStudent(${s.id})">Delete</button>
                    </div>
                </div>`).join('') : '<p>No students found</p>';
            
            renderPagination();
        }

        function renderPagination() {
            const totalPages = Math.ceil(allStudents.length / perPage);
            let html = '';
            if (totalPages > 1) {
                if (currentPage > 1) {
                    html += `<button onclick="goToPage(${currentPage - 1})">Prev</button> `;
                }
                for (let i = 1; i <= totalPages; i++) {
                    html += `<button onclick="goToPage(${i})" ${i === currentPage ? 'style="font-weight:bold"' : ''}>${i}</button> `;
                }
                if (currentPage < totalPages) {
                    html += `<button onclick="goToPage(${currentPage + 1})">Next</button>`;
                }
            }
            document.getElementById('pagination').innerHTML = html;
        }

        function goToPage(page) {
            currentPage = page;
            renderStudents();
        }

        function editStudent(id, name, age, email) {
            document.getElementById('updateId').value = id;
            document.getElementById('updateName').value = name;
            document.getElementById('updateAge').value = age;
            document.getElementById('updateEmail').value = email;
            document.getElementById('updateId').focus();
        }

        async function deleteStudent(id) {
            if (confirm('Are you sure you want to delete this student?')) {
                await fetch(API + '/students/' + id, { method: 'DELETE' });
                loadStudents();
            }
        }

        async function getStudent() {
            const id = document.getElementById('getId').value;
            if (!id) {
                loadStudents();
                return;
            }
            const res = await fetch(API + '/students/' + id);
            if (res.ok) {
                const s = await res.json();
                document.getElementById('studentDetail').innerHTML = `<div class="student-item">
                    <div class="student-info"><strong>ID:</strong> ${s.id} | <strong>Name:</strong> ${s.name} | <strong>Age:</strong> ${s.age} | <strong>Email:</strong> ${s.email}</div>
                </div>`;
            } else {
                document.getElementById('studentDetail').innerHTML = '<p>Student not found</p>';
            }
        }

        document.getElementById('addForm').onsubmit = async (e) => {
            e.preventDefault();
            await fetch(API + '/students', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({
                    name: document.getElementById('addName').value,
                    age: parseInt(document.getElementById('addAge').value),
                    email: document.getElementById('addEmail').value
                })
            });
            loadStudents();
            document.getElementById('addForm').reset();
        };

        document.getElementById('updateForm').onsubmit = async (e) => {
            e.preventDefault();
            const id = document.getElementById('updateId').value;
            const data = {};
            if (document.getElementById('updateName').value) data.name = document.getElementById('updateName').value;
            if (document.getElementById('updateAge').value) data.age = parseInt(document.getElementById('updateAge').value);
            if (document.getElementById('updateEmail').value) data.email = document.getElementById('updateEmail').value;
            
            await fetch(API + '/students/' + id, {
                method: 'PUT',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify(data)
            });
            loadStudents();
            document.getElementById('updateForm').reset();
        };

        document.getElementById('deleteForm').onsubmit = async (e) => {
            e.preventDefault();
            const id = document.getElementById('deleteId').value;
            await fetch(API + '/students/' + id, { method: 'DELETE' });
            loadStudents();
            document.getElementById('deleteForm').reset();
        };

        document.getElementById('getForm').onsubmit = async (e) => {
            e.preventDefault();
            await getStudent();
        };

    </script>
</body>
</html>
